name: smarteat
description: Smart Eat - Eatery Management System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase - Compatible versions
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.0
  firebase_analytics: ^10.8.7
  firebase_messaging: ^14.7.10
  firebase_auth_web: ^5.9.0  # Updated to compatible version
  # Other dependencies
  http: ^1.1.2
  image_picker: ^0.8.8+1
  provider: ^6.1.1
  intl: ^0.19.0
  fl_chart: ^0.65.0
  uuid: ^4.0.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_local_notifications: ^17.2.4
  audioplayers: ^6.0.0
  lottie: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/
    - assets/animations/
