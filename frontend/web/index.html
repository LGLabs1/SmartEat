<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartEat - Eatery Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SmartEat">
  <link rel="apple-touch-icon" href="icons/Icon-192-smarteat-v4.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-smarteat-v4.png"/>

  <title>SmartEat</title>
  <link rel="manifest" href="manifest.json?v=smarteat-v6">
  <script>
    (function () {
      var flag = 'smarteat-web-reset-v6';
      var storage;
      try {
        storage = window.localStorage;
      } catch (_) {
        return;
      }
      if (storage.getItem(flag) === 'done') return;

      (async function () {
        var completed = false;
        try {
          var changed = false;

          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            var baseUrl = new URL(document.baseURI || '/', window.location.href).href;
            if (baseUrl.charAt(baseUrl.length - 1) !== '/') baseUrl += '/';
            var registrations = await navigator.serviceWorker.getRegistrations();
            var appRegistrations = registrations.filter(function (registration) {
              return String(registration.scope).indexOf(baseUrl) === 0;
            });
            if (appRegistrations.length) {
              changed = true;
              await Promise.all(appRegistrations.map(function (registration) {
                return registration.unregister();
              }));
            }
          }

          if (window.caches && caches.keys) {
            var names = await caches.keys();
            var appCaches = names.filter(function (name) {
              return String(name).indexOf('flutter-') === 0;
            });
            if (appCaches.length) {
              changed = true;
              await Promise.all(appCaches.map(function (name) {
                return caches.delete(name);
              }));
            }
          }

          storage.setItem(flag, 'done');
          completed = true;
          if (changed) window.location.reload();
        } catch (_) {
          // Leave the flag unset so cleanup is retried on the next load.
        } finally {
          document.documentElement.setAttribute(
            'data-smarteat-web-reset',
            completed ? 'done' : 'pending'
          );
        }
      })();
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
