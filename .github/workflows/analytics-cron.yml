name: SmartEat Scheduled Jobs

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: all
        type: choice
        options:
          - all
          - analytics
          - attendance
          - daily_sms

jobs:
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'analytics'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run analytics job
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANALYTICS_WINDOW_DAYS: '90'
          FORECAST_DAYS: '7'
        run: node cron_analytics.js

  attendance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'attendance'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run attendance job
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TZ: Asia/Manila
        run: node cron_attendance.js

  daily_sms:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 16 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'daily_sms'))

    steps:
      - name: Trigger daily summary SMS
        env:
          API_BASE_URL: ${{ secrets.SMARTEAT_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.SMARTEAT_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$API_BASE_URL/sms/daily-summary/cron" \
            -H "x-cron-secret: $CRON_SECRET"
