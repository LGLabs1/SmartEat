name: SmartEat Scheduled Jobs

on:
  schedule:
    - cron: '0 * * * *'     # Every hour for analytics
    - cron: '0 0 * * *'     # Midnight for attendance
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run analytics job
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANALYTICS_WINDOW_DAYS: '90'
          FORECAST_DAYS: '7'
        run: node cron_analytics.js

  attendance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run attendance job
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node cron_attendance.js
